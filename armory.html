    <main class="main">
      <section class="armory__hero">
        <div class="armoryhero__container">
          <div class="hero__text">
            <h1 class="hero__heading">Armory</h1>
          </div>
        </div>
      </section>
      <section class="armory__quote">
        <div class="quote__container">
            <blockquote class="quote__text">
                "The Armor of a Helldiver shows the will and the colors of Super Earth.<br>
                 Spread our great cause embellished in flair and safety, remember<br>
                 Democracy Protects.”
            </blockquote>
            <hr class="quote__line">
        </div>
      </section>
      <section class="armory">
        <div class="armory__container">
          <h2 class="armor__name">DS-42</h2>
          <figure class="armory__figure">
            <img class="armory__image" src="./img/DS-42.png" alt="Dust Devils Image" />
            <figcaption class="armory__figcaption">
                "This patriotic armor comes<br>
                recommended by the Ministry of <br>
                Expansion, to re-seize from our enemies <br>
                any territory that any human laid claim to, <br>
                that any point in time." <br>
                <br>
                - Armory description <br>
                <br>
                Armor Type: Heavy Armor <br>
                Armor: 150 <br>
                Speed: 450 <br>
                Stamina: 50 <br>
                Passive: Desert Stormer <br>
                "Provides 40% resistance to fire,<br>
                gas, acid, and electrical damage.<br>
                Increases throwing range by 20%."<br>
            </figcaption>
          </figure>
          <h2 class="armor__name">Helljumper</h2>
          <figure class="armory__figure">
            <img class="armory__image" src="./img/hell-jumper.png" alt="ODST Collab image" />
            <figcaption class="armory__figcaption">
              "Debuted during the New Mombasa<br>
                Armor show, this sleek ensemble is<br>
                sure to turn heads and blow minds.<br>
                <br>
                - Armory description <br>
                <br>
                Armor Type: Medium Armor <br>
                Armor: 100 <br>
                Speed: 500 <br>
                Stamina: 100 <br>
                Passive: Desert Stormer <br>
                "Wearer makes 50% less noise<br>
                when moving. Increases point<br>
                of-interest identification range by 30%<br>
                Provides immunity to leg injuries."<br>
            </figcaption>
          </figure>
          <h2 class="armor__name">DS-191</h2>
          <figure class="armory__figure">
            <img class="armory__image" src="./img/DS-191.png" alt="ODST Collab image" />
            <figcaption class="armory__figcaption">
                "This multi-layered protective<br>
                armor keeps rough sand, spores,<br>
                and other coarse granules from<br>
                Irritating the skinn"<br>
                <br>
                - Armory description <br>
                <br>
                Armor Type: Medium Armor <br>
                Armor: 100 <br>
                Speed: 500 <br>
                Stamina: 100 <br>
                Passive: Desert Stormer <br>
                "Provides 40% resistance to fire,<br>
                gas, acid, and electrical damage.<br>
                Increases throwing range by 20%."<br>
            </figcaption>
          </figure>
        </div>
      </section>
