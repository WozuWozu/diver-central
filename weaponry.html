<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <title>Weaponry</title>
    <link rel="stylesheet" href="./css/styles.css" />
    <link rel="stylesheet" href="./css/weaponry-styles.css" />
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=close,menu" />
  </head>
  <body>
    <header class="header">
      <div class="header__container">
        <a class="header__link" href="./index.html"><img class="header__logo" src="./img/logo.png" /></a>
        <nav class="header__nav" id="nav-pad">
          <ul class="header__list">
            <li class="header__list-item">
              <a class="header__link" href="./warbonds.html">WARBONDS</a>
            </li>
            <li class="header__list-item">
              <a class="header__link" href="./armory.html">ARMORY</a>
            </li>
            <li class="header__list-item">
              <a class="header__link" href="./weaponry.html">WEAPONRY</a>
            </li>
          </ul>
          <span class="header__exit material-symbols-outlined" id="erase">
          close
          </span>
        </nav>
        <span class="header__hamburger material-symbols-outlined" id="burgur">
        menu
        </span>
      </div>
    </header>
    <main class="main">
      <section class="weaponry__hero">
        <div class="weaponryhero__container">
          <div class="hero__text">
            <h1 class="hero__heading">WEAPONRY</h1>
          </div>
        </div>
      </section>
      <section class="weaponry__quote">
        <div class="quote__container">
            <blockquote class="quote__text">
                "The weapons of a Helldiver decide their outcome<br>
                 in battle. A well thought out loadout for each and<br>
                 Every enemy of democracy serves as a gurantee for <br>
                Super Earth's success."
            </blockquote>
            <hr class="quote__line">
        </div>
      </section>
      <section class="weaponry">
        <div class="weaponry__container">
          <figure class="weaponry__figure">
            <img class="weaponry__image" src="./img/ar-2.png" alt="AR-2 Coyote" />
            <figcaption class="weaponry__figcaption">
                Weapon Category: Primary Weapon<br>
                Weapon Type: Assault Rifle<br>
                Standard Damage: 75 Ballistic<br>
                Max Penetration:   Medium <br>
                Capacity: 45<br>
                Recoil: 17<br>
                Fire Rate: 600 rpm<br>
                DPS: 750<br>
                Spare Mags: 8<br>
            </figcaption>
          </figure>
          <figure class="weaponry__figure">
            <img class="weaponry__image" src="./img/ma5c.png" alt="MA5C Assault Rifle" />
            <figcaption class="weaponry__figcaption">
                Weapon Category: Primary Weapon<br>
                Weapon Type: Assault Rifle<br>
                Standard Damage: 75 Ballistic<br>
                Max Penetration:   Medium <br>
                Capacity: 45<br>
                Recoil: 17<br>
                Fire Rate: 600 rpm<br>
                DPS: 750<br>
                Spare Mags: 8<br>
            </figcaption>
          </figure>
          <figure class="weaponry__figure">
            <img class="weaponry__image" src="./img/m901.png" alt="M901 Shotgun" />
            <figcaption class="weaponry__figcaption">
                Weapon Category: Primary Weapon<br>
                Weapon Type: Shotguns<br>
                Standard Damage: 605 Ballistic<br>
                Max Penetration:    Light <br>
                Capacity: 6<br>
                Recoil: 83<br>
                Fire Rate: 80 rpm<br>
                DPS: 806.67<br>
                Spare Shells: 44<br>
            </figcaption>
          </figure>
        </div>
      </section>
    </main>
    <footer class="footer">
      <div class="footer__container">
        <a class="footer__link" href="mailto:lovesuperearth@diver.com">LOVESUPEREARTH@DIVER.COM</a>
      </div>
    </footer>
    <script src="./js/script.js"></script>
  </body>
</html>
