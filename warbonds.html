<!doctype html>
<html lang="en">
  <head>

    <title>Warbonds</title>
    <link rel="stylesheet" href="./css/styles.css" />
    <link rel="stylesheet" href="./css/warbonds-styles.css" />
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=close,menu" />
  </head>
  <body>
    <header class="header">
      <div class="header__container">
        <a class="header__link" href="./index.html"><img class="header__logo" src="./img/logo.png" /></a>
        <nav class="header__nav" id="nav-pad">
          <ul class="header__list">
            <li class="header__list-item">
              <a class="header__link" href="./warbonds.html">WARBONDS</a>
            </li>
            <li class="header__list-item">
              <a class="header__link" href="./armory.html">ARMORY</a>
            </li>
            <li class="header__list-item">
              <a class="header__link" href="./weaponry.html">WEAPONRY</a>
            </li>
          </ul>
          <span class="header__exit material-symbols-outlined" id="erase">
          close
          </span>
        </nav>
        <span class="header__hamburger material-symbols-outlined" id="burgur">
        menu
        </span>
      </div>
    </header>
    <main class="main">
      <section class="warbonds__hero">
        <div class="warbondshero__container">
          <div class="hero__text">
            <h1 class="hero__heading">WARBONDS</h1>
          </div>
        </div>
      </section>
      <section class="warbond__quote">
        <div class="quote__container">
            <blockquote class="quote__text">
                "Warbonds are designed by the Ministry of  Defense.<br>
                A package of firepower to deter the tyranny of those who challenge <br>
                Super Earth"
            </blockquote>
            <hr class="quote__line">
        </div>
      </section>
      <section class="warbonds">
        <div class="warbonds__container">
          <figure class="dustdevils__figure">
            <img class="warbonds__image" src="./img/dust-devils.png" alt="Dust Devils Image" />
            <figcaption class="warbonds__figcaption">
              Dust Devils
            </figcaption>
          </figure>
          <figure class="odst__figure">
            <img class="warbonds__image" src="./img/odst.png" alt="ODST Collab image" />
            <figcaption class="warbonds__figcaption">
              ODST (Obedience Democracy Shock Troopers)
            </figcaption>
          </figure>
        </div>
      </section>
    </main>
    <footer class="footer">
      <div class="footer__container">
        <a class="footer__link" href="mailto:lovesuperearth@diver.com">LOVESUPEREARTH@DIVER.COM</a>
      </div>
